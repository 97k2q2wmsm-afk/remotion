# fly launch --copy-config --dockerfile render-worker/Dockerfile ; fly secrets set WORKER_TOKEN=... ALLOWED_ORIGIN=https://your-app
app = "creator-studio-render"
primary_region = "fra"

[build]
  dockerfile = "render-worker/Dockerfile"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
