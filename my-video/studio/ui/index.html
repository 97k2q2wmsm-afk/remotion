<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="theme-color" content="#0b0c10" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<title>Cinematic AI Studio</title>
	<link rel="icon" href="icon.svg" type="image/svg+xml" />
	<link rel="apple-touch-icon" href="icon.svg" />
	<link rel="stylesheet" href="app.css" />
</head>
<body>
	<div class="app">
		<aside class="sidebar" id="sidebar">
			<div class="brand"><img src="icon.svg" alt="" /><div><strong>Cinematic</strong><span>AI Studio</span></div></div>
			<nav id="nav"></nav>
			<div class="side-foot" id="side-foot"></div>
		</aside>
		<main>
			<header class="topbar">
				<div class="crumbs" id="crumbs"></div>
				<div class="savestate" id="savestate"></div>
			</header>
			<div class="view" id="view"><div class="empty">Loading…</div></div>
		</main>
	</div>
	<nav class="tabbar" id="tabbar"></nav>
	<div class="sheet" id="sheet" hidden></div>
	<div class="toasts" id="toasts"></div>
	<script type="module" src="app.js"></script>
</body>
</html>
